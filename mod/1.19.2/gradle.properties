# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact.
minecraft_version=1.19.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.19.2,1.20)
# The Forge version must agree with the Minecraft version to get a valid artifact.
forge_version=43.5.0
# The Forge version range can use any version of Forge as bounds or match the loader version range.
forge_version_range=[43,)
# The loader version range can only use the major version of Forge/FML as bounds.
loader_version_range=[43,)
# The mapping channel/version for the given Minecraft version.
mapping_channel=official
mapping_version=1.19.2

## Mod Properties

# The unique mod identifier. Lowercase.
mod_id=hwidadmin
# The human-readable display name.
mod_name=HWIDAdmin
# The license of the mod.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID, should match the base package.
mod_group_id=com.hwidadmin
# The authors of the mod (display only).
mod_authors=HWID Admin
# Short description shown on the mod list screen.
mod_description=Client HWID auth helper. Sends the player's machine HWID to the HWIDAdmin server plugin for a whitelist check.
