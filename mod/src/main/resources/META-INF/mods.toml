modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
# This mod only ever does anything on the logical client, so it is skipped on
# dedicated servers and never shows a version-mismatch red X in the server list.
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"

# No access transformers are used.
accessTransformers = []

description="${mod_description}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
