# See https://docs.minecraftforge.net/en/1.21.x/gettingstarted/modfiles/#modstoml

modLoader="javafml"
loaderVersion="[52,)"
license="All Rights Reserved"
# This mod only ever does anything on the logical client, so it is skipped on
# dedicated servers.
clientSideOnly=true

[[mods]]
modId="hwidadmin"
version="1.0.0"
displayName="HWIDAdmin"
authors="HWID Admin"

# No access transformers are used.
accessTransformers = []

description="Client HWID auth helper. Sends the player's machine HWID to the HWIDAdmin server plugin for a whitelist check."

[[dependencies.hwidadmin]]
    modId="forge"
    mandatory=true
    versionRange="[52,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.hwidadmin]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"
