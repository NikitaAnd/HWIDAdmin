name: build

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Build Forge mod (1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build mod
        id: modbuild
        working-directory: mod
        run: |
          ./gradlew build --console=plain --no-daemon --stacktrace > gradle-build.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Surface mod failure log
        if: failure()
        run: |
          {
            echo '## Forge mod build failed'
            echo '```'
            tail -n 300 mod/gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE 'FAILED|error:|What went wrong|Caused by|Execution failed|Could not (resolve|find|determine|compile)|Unsupported|Exception|> Task' mod/gradle-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 80 mod/gradle-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-mod
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-sources.jar
            !mod/build/libs/*-dev-shadow.jar

  plugin:
    name: Build Bukkit plugin (Spigot 1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build plugin
        run: mvn -B -ntp package
        working-directory: plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-plugin
          path: |
            plugin/target/*.jar
            !plugin/target/*-sources.jar

  release:
    name: Publish GitHub Release
    needs: [mod, plugin]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: HWIDAdmin-mod
          path: artifacts/mod

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: HWIDAdmin-plugin
          path: artifacts/plugin

      - name: List artifacts
        run: |
          find artifacts -type f -print
          ls -la artifacts/mod artifacts/plugin || true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            set -euo pipefail
            REPO="$GITHUB_REPOSITORY"

            echo "-> cleaning stale release/tag 'latest'"
            # Best-effort cleanup: ignore "not found" (404) and "reference does not exist" (422).
            gh release delete latest --repo "$REPO" --cleanup-tag --yes 2>/dev/null || echo "   (no stale release or tag)"
            sleep 2

            ls -la artifacts/mod artifacts/plugin || true

            echo "-> creating tag"
            gh api -X POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/latest" \
              -f sha="$GITHUB_SHA" >/dev/null || { echo "note: tag create failed (may already exist)"; }

            echo "-> creating release via REST"
            gh api -X POST "repos/$REPO/releases" \
              -f tag_name="latest" \
              -f name="HWIDAdmin build $GITHUB_RUN_NUMBER" \
              -f body="Auto-built from commit $GITHUB_SHA. Mod = Forge 1.20.1 client; plugin = Spigot/Paper 1.20.1." \
              >/tmp/release.json || true

            cat /tmp/release.json 2>/dev/null | head -c 500; echo

            UPID="$(python3 -c "import json;d=json.load(open('/tmp/release.json'));print(d.get('id',''))" 2>/dev/null || true)"
            if [ -z "$UPID" ]; then
              echo "::error::could not create release; response above"
              exit 1
            fi
            echo "   release id = $UPID"

            echo "-> uploading assets"
            for f in artifacts/mod/*.jar artifacts/plugin/*.jar; do
              [ -f "$f" ] || continue
              base="$(basename "$f")"
              echo "   uploading $base"
              resp="$(gh api -X POST "repos/$REPO/releases/$UPID/assets?name=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote('$base'))")" \
                -H "Content-Type: application/java-archive" \
                --input "$f" 2>&1 || true)"
              if echo "$resp" | grep -q '"browser_download_url"'; then
                echo "   OK: $base"
              else
                echo "::error::failed to upload $base: $(echo "$resp" | head -c 400)"
              fi
            done

            echo "-> done. Release assets:"
            gh api "repos/$REPO/releases/$UPID" --jq '.assets[] | .name + \" (\" + (.size|tostring) + \" bytes)\"' 2>/dev/null || true
          } 2>&1 | tee /tmp/publish.log
          ec="${PIPESTATUS[0]}"
          if [ "$ec" -ne 0 ]; then
            tail -n 60 /tmp/publish.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$ec"
          fi



