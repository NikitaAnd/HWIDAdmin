name: build

on:
  push:
    branches: [main, 'arena/**', 'minecraft/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Version discovery.
  #
  # Supports both repository layouts:
  #   - multi-version  (main / arena/**):  mod/<mc>/…  plugin/<mc>/…
  #   - single-version (minecraft/**):     mod/…       plugin/…   at repo root
  #
  # It detects the Minecraft version per subdirectory (multi-version) or from
  # the mod's build files (single-version) and emits a JSON matrix consumed by
  # the build jobs below.
  # ---------------------------------------------------------------------------
  setup-matrix:
    name: Detect versions
    runs-on: ubuntu-22.04
    outputs:
      list: ${{ steps.detect.outputs.list }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect versions
        id: detect
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib, re

          MOD = pathlib.Path('mod')
          PLUGIN = pathlib.Path('plugin')

          def is_multi(root, marker):
              # multi-version iff the markers live in <root>/<version>/<marker>,
              # single-version iff the marker is directly at <root>/<marker>.
              if not root.is_dir() or (root / marker).is_file():
                  return False
              return any(p.is_dir() and (p / marker).is_file()
                         for p in root.iterdir())

          multi_mod = is_multi(MOD, 'build.gradle')
          multi_plugin = is_multi(PLUGIN, 'pom.xml')

          def java_for(version):
              return 21 if version.startswith('1.21') else 17

          include = []
          if multi_mod or multi_plugin:
              # multi-version layout: one version per subdirectory
              vers = set()
              if multi_mod:
                  vers |= {p.name for p in MOD.iterdir()
                           if p.is_dir() and (p / 'build.gradle').is_file()}
              if multi_plugin:
                  vers |= {p.name for p in PLUGIN.iterdir()
                           if p.is_dir() and (p / 'pom.xml').is_file()}
              order = {'1.19.2': 0, '1.19.4': 1, '1.20.1': 2,
                       '1.20.4': 3, '1.21.1': 4, '1.21.4': 5}
              for v in sorted(vers, key=lambda x: (order.get(x, 99), x)):
                  mdir = MOD / v
                  pdir = PLUGIN / v
                  include.append({
                      'version': v,
                      'java': java_for(v),
                      'modDir': str(mdir) if mdir.is_dir() else '',
                      'pluginDir': str(pdir) if pdir.is_dir() else '',
                  })
          else:
              # single-version layout (minecraft/* branches): mod/ + plugin/ at root
              mdir = 'mod' if (MOD / 'build.gradle').is_file() else ''
              pdir = 'plugin' if (PLUGIN / 'pom.xml').is_file() else ''
              if mdir or pdir:
                  version = 'unknown'
                  gp = MOD / 'gradle.properties'
                  if gp.is_file():
                      for line in gp.read_text().splitlines():
                          if line.startswith('minecraft_version='):
                              version = line.split('=', 1)[1].strip()
                              break
                  if version == 'unknown':
                      bg = MOD / 'build.gradle'
                      if bg.is_file():
                          m = re.search(r"mappings[^\n]*version:\s*'(1\.[0-9]+\.[0-9]+)'",
                                        bg.read_text())
                          if m:
                              version = m.group(1)
                  include.append({
                      'version': version,
                      'java': java_for(version),
                      'modDir': mdir,
                      'pluginDir': pdir,
                  })

          print('list=' + json.dumps({'include': include}))
          PY

  # ---------------------------------------------------------------------------
  # Forge client mods — one job per detected version.
  # ---------------------------------------------------------------------------
  mod:
    name: Forge mod (${{ matrix.version }})
    needs: setup-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build mod
        working-directory: ${{ matrix.modDir }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain --no-daemon --stacktrace > gradle-build.log 2>&1

      - name: Surface mod failure log
        if: failure()
        run: |
          {
            echo '## Forge mod build failed (${{ matrix.version }})'
            echo '```'
            tail -n 300 "${{ matrix.modDir }}/gradle-build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE 'FAILED|error:|What went wrong|Caused by|Execution failed|Could not (resolve|find|determine|compile)|Unsupported|Exception class|> Task' "${{ matrix.modDir }}/gradle-build.log" | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 80 "${{ matrix.modDir }}/gradle-build.log" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-mod-${{ matrix.version }}
          path: |
            ${{ matrix.modDir }}/build/libs/*.jar
            !${{ matrix.modDir }}/build/libs/*-sources.jar
            !${{ matrix.modDir }}/build/libs/*-dev-shadow.jar

  # ---------------------------------------------------------------------------
  # Bukkit/Spigot/Paper plugins — one job per detected version.
  # ---------------------------------------------------------------------------
  plugin:
    name: Bukkit plugin (${{ matrix.version }})
    needs: setup-matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build plugin
        working-directory: ${{ matrix.pluginDir }}
        run: mvn -B -ntp package

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-plugin-${{ matrix.version }}
          path: |
            ${{ matrix.pluginDir }}/target/*.jar
            !${{ matrix.pluginDir }}/target/*-sources.jar

  # ---------------------------------------------------------------------------
  # Aggregate release — attaches all built jars to one GitHub Release with
  # unique, version-specific names.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [mod, plugin]
    # Only aggregate a full release for the multi-version branches. Per-version
    # branches (minecraft/*) still build + upload artifacts, but don't release.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Normalize artifact names
        run: |
          mkdir -p out
          # download-artifact extracts each artifact into
          # artifacts/<artifact-name>/…, where <artifact-name> is already the
          # desired release asset name (e.g. HWIDAdmin-mod-1.20.1).
          find artifacts -mindepth 2 -type f -name '*.jar' | sort | while IFS= read -r f; do
            name="$(echo "$f" | cut -d/ -f2)"
            cp "$f" "out/${name}.jar"
          done
          ls -la out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          TAG="build-$GITHUB_RUN_NUMBER"

          # 1) Create the tag for this build (skip if exists).
          gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true

          # 2) Create the release.
          echo "-> creating release $TAG"
          gh api -X POST "repos/$REPO/releases" \
            -f tag_name="$TAG" \
            -f name="HWIDAdmin build $GITHUB_RUN_NUMBER" \
            -f body="Auto-built from commit $GITHUB_SHA (branch $GITHUB_REF_NAME)." \
            >/tmp/rel.json 2>/tmp/rel.err || { echo "::error::release create failed: $(head -c 400 /tmp/rel.err)"; exit 1; }
          cat /tmp/rel.json | head -c 300; echo
          RLID="$(python3 -c "import json;print(json.load(open('/tmp/rel.json')).get('id',''))" 2>/dev/null || true)"
          if [ -z "$RLID" ]; then echo "::error::no release id"; exit 1; fi

          # 3) Upload each jar as an asset.
          for f in out/*.jar; do
            echo "-> uploading $(basename "$f")"
            gh api -X POST \
              "$(python3 -c "import json;print(json.load(open('/tmp/rel.json'))['upload_url'].split('{')[0])")?name=$(basename "$f")" \
              -H "Content-Type: application/octet-stream" \
              --input "$f" >/tmp/up.json 2>/tmp/up.err || { echo "::error::asset upload failed for $(basename "$f"): $(head -c 500 /tmp/up.err)"; exit 1; }
            echo "   -> $(python3 -c "import json;d=json.load(open('/tmp/up.json'));print(d.get('name'), d.get('size'))" 2>/dev/null || true)"
          done

          echo "-> release ready:"
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.html_url'
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | .browser_download_url' 2>/dev/null || true
