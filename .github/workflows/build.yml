name: build

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Forge client mods — one job per Minecraft version.
  # ---------------------------------------------------------------------------
  mod:
    name: Forge mod (${{ matrix.mc }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.19.2', java: 17, dir: mod/1.19.2 }
          - { mc: '1.19.4', java: 17, dir: mod/1.19.4 }
          - { mc: '1.20.1', java: 17, dir: mod/1.20.1 }
          - { mc: '1.20.4', java: 17, dir: mod/1.20.4 }
          - { mc: '1.21.1', java: 21, dir: mod/1.21.1 }
          - { mc: '1.21.4', java: 21, dir: mod/1.21.4 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build mod
        id: modbuild
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain --no-daemon --stacktrace > gradle-build.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Surface mod failure log
        if: failure()
        run: |
          {
            echo '## Forge mod build failed (${{ matrix.mc }})'
            echo '```'
            tail -n 300 "${{ matrix.dir }}/gradle-build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE 'FAILED|error:|What went wrong|Caused by|Execution failed|Could not (resolve|find|determine|compile)|Unsupported|Exception class|> Task' "${{ matrix.dir }}/gradle-build.log" | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 80 "${{ matrix.dir }}/gradle-build.log" | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-mod-${{ matrix.mc }}
          path: |
            ${{ matrix.dir }}/build/libs/*.jar
            !${{ matrix.dir }}/build/libs/*-sources.jar
            !${{ matrix.dir }}/build/libs/*-dev-shadow.jar

  # ---------------------------------------------------------------------------
  # Bukkit/Spigot/Paper plugins — one job per Minecraft version.
  # ---------------------------------------------------------------------------
  plugin:
    name: Bukkit plugin (${{ matrix.mc }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.19.2', java: 17, dir: plugin/1.19.2 }
          - { mc: '1.19.4', java: 17, dir: plugin/1.19.4 }
          - { mc: '1.20.1', java: 17, dir: plugin/1.20.1 }
          - { mc: '1.20.4', java: 17, dir: plugin/1.20.4 }
          - { mc: '1.21.1', java: 21, dir: plugin/1.21.1 }
          - { mc: '1.21.4', java: 21, dir: plugin/1.21.4 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build plugin
        working-directory: ${{ matrix.dir }}
        run: mvn -B -ntp package

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-plugin-${{ matrix.mc }}
          path: |
            ${{ matrix.dir }}/target/*.jar
            !${{ matrix.dir }}/target/*-sources.jar

  # ---------------------------------------------------------------------------
  # Aggregate release — downloads all artifacts and attaches them to one
  # GitHub Release with unique, version-specific names.
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [mod, plugin]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Normalize artifact names
        run: |
          mkdir -p out
          # download-artifact extracts each artifact into
          # artifacts/<artifact-name>/…, where <artifact-name> is already the
          # desired release asset name (e.g. HWIDAdmin-mod-1.20.1). Inside it,
          # the built jar is hwidadmin-1.0.0.jar / HWIDAdmin-1.0.0.jar.
          find artifacts -mindepth 2 -type f -name '*.jar' | sort | while IFS= read -r f; do
            name="$(echo "$f" | cut -d/ -f2)"
            cp "$f" "out/${name}.jar"
          done
          ls -la out

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          TAG="build-$GITHUB_RUN_NUMBER"

          # 1) Create the tag for this build (skip if exists).
          gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true

          # 2) Create the release.
          echo "-> creating release $TAG"
          gh api -X POST "repos/$REPO/releases" \
            -f tag_name="$TAG" \
            -f name="HWIDAdmin build $GITHUB_RUN_NUMBER" \
            -f body="Auto-built from commit $GITHUB_SHA (branch $GITHUB_REF_NAME). Includes Forge mods and Bukkit plugins for Minecraft 1.19.2, 1.19.4, 1.20.1, 1.20.4, 1.21.1, 1.21.4." \
            >/tmp/rel.json 2>/tmp/rel.err || { echo "::error::release create failed: $(head -c 400 /tmp/rel.err)"; exit 1; }
          cat /tmp/rel.json | head -c 300; echo
          RLID="$(python3 -c "import json;print(json.load(open('/tmp/rel.json')).get('id',''))" 2>/dev/null || true)"
          if [ -z "$RLID" ]; then echo "::error::no release id"; exit 1; fi

          # 3) Upload each jar as an asset.
          for f in out/*.jar; do
            echo "-> uploading $(basename "$f")"
            gh api -X POST \
              "$(python3 -c "import json;print(json.load(open('/tmp/rel.json'))['upload_url'].split('{')[0])")?name=$(basename "$f")" \
              -H "Content-Type: application/octet-stream" \
              --input "$f" >/tmp/up.json 2>/tmp/up.err || { echo "::error::asset upload failed for $(basename "$f"): $(head -c 500 /tmp/up.err)"; exit 1; }
            echo "   -> $(python3 -c "import json;d=json.load(open('/tmp/up.json'));print(d.get('name'), d.get('size'))" 2>/dev/null || true)"
          done

          echo "-> release ready:"
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.html_url'
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | .browser_download_url' 2>/dev/null || true
