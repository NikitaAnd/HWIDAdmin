name: build

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Build Forge mod (1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build mod
        id: modbuild
        working-directory: mod
        run: |
          ./gradlew build --console=plain --no-daemon --stacktrace > gradle-build.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Surface mod failure log
        if: failure()
        run: |
          {
            echo '## Forge mod build failed'
            echo '```'
            tail -n 300 mod/gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE 'FAILED|error:|What went wrong|Caused by|Execution failed|Could not (resolve|find|determine|compile)|Unsupported|Exception|> Task' mod/gradle-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 80 mod/gradle-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-mod
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-sources.jar
            !mod/build/libs/*-dev-shadow.jar

  plugin:
    name: Build Bukkit plugin (Spigot 1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build plugin
        run: mvn -B -ntp package
        working-directory: plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-plugin
          path: |
            plugin/target/*.jar
            !plugin/target/*-sources.jar

  release:
    name: Publish GitHub Release
    needs: [mod, plugin]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: HWIDAdmin-mod
          path: artifacts/mod

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: HWIDAdmin-plugin
          path: artifacts/plugin

      - name: List artifacts
        run: |
          find artifacts -type f -print
          ls -la artifacts/mod artifacts/plugin || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="$GITHUB_REPOSITORY"
          TAG="build-$GITHUB_RUN_NUMBER"

          # 1) Create the tag for this build (skip if exists).
          gh api -X POST "repos/$REPO/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true

          # 2) Create the release.
          echo "-> creating release $TAG"
          gh api -X POST "repos/$REPO/releases" \
            -f tag_name="$TAG" \
            -f name="HWIDAdmin build $GITHUB_RUN_NUMBER" \
            -f body="Auto-built from commit $GITHUB_SHA (branch $GITHUB_REF_NAME)." \
            >/tmp/rel.json 2>/tmp/rel.err || { echo "::error::release create failed: $(head -c 400 /tmp/rel.err)"; exit 1; }
          cat /tmp/rel.json | head -c 300; echo
          RLID="$(python3 -c "import json;print(json.load(open('/tmp/rel.json')).get('id',''))" 2>/dev/null || true)"
          if [ -z "$RLID" ]; then echo "::error::no release id"; exit 1; fi

          # 3) Upload each jar as an asset.
          for f in artifacts/mod/*.jar artifacts/plugin/*.jar; do
            echo "-> uploading $(basename "$f")"
            gh api -X POST \
              "$(python3 -c "import json;print(json.load(open('/tmp/rel.json'))['upload_url'].split('{')[0])")?name=$(basename "$f")" \
              -H "Content-Type: application/octet-stream" \
              --input "$f" >/tmp/up.json 2>/tmp/up.err || { echo "::error::asset upload failed for $(basename "$f"): $(head -c 400 /tmp/up.err)"; exit 1; }
            echo "   -> $(python3 -c "import json;d=json.load(open('/tmp/up.json'));print(d.get('name'), d.get('size'))" 2>/dev/null || true)"
          done

          echo "-> release ready:"
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.html_url'
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | .browser_download_url' 2>/dev/null || true
