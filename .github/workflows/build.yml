name: build

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Build Forge mod (1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build mod
        run: ./gradlew build
        working-directory: mod

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-mod
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-sources.jar
            !mod/build/libs/*-dev-shadow.jar

  plugin:
    name: Build Bukkit plugin (Spigot 1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build plugin
        run: mvn -B -ntp package
        working-directory: plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-plugin
          path: |
            plugin/target/*.jar
            !plugin/target/*-sources.jar
