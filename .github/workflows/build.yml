name: build

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod:
    name: Build Forge mod (1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build mod
        id: modbuild
        working-directory: mod
        run: |
          ./gradlew build --console=plain --no-daemon --stacktrace > gradle-build.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Surface mod failure log
        if: failure()
        run: |
          {
            echo '## Forge mod build failed'
            echo '```'
            tail -n 250 mod/gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Emit as annotations so failures are readable via the Checks API.
          tail -n 60 mod/gradle-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-mod
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-sources.jar
            !mod/build/libs/*-dev-shadow.jar

  plugin:
    name: Build Bukkit plugin (Spigot 1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build plugin
        run: mvn -B -ntp package
        working-directory: plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-plugin
          path: |
            plugin/target/*.jar
            !plugin/target/*-sources.jar
