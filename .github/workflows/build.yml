name: build

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mod:
    name: Build Forge mod (1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build mod
        id: modbuild
        working-directory: mod
        run: |
          ./gradlew build --console=plain --no-daemon --stacktrace > gradle-build.log 2>&1
          echo "GRADLE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Surface mod failure log
        if: failure()
        run: |
          {
            echo '## Forge mod build failed'
            echo '```'
            tail -n 300 mod/gradle-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -nE 'FAILED|error:|What went wrong|Caused by|Execution failed|Could not (resolve|find|determine|compile)|Unsupported|Exception|> Task' mod/gradle-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 80 mod/gradle-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Upload mod artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-mod
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-sources.jar
            !mod/build/libs/*-dev-shadow.jar

  plugin:
    name: Build Bukkit plugin (Spigot 1.20.1)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build plugin
        run: mvn -B -ntp package
        working-directory: plugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: HWIDAdmin-plugin
          path: |
            plugin/target/*.jar
            !plugin/target/*-sources.jar

  release:
    name: Publish GitHub Release
    needs: [mod, plugin]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download mod artifact
        uses: actions/download-artifact@v4
        with:
          name: HWIDAdmin-mod
          path: artifacts/mod

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: HWIDAdmin-plugin
          path: artifacts/plugin

      - name: List artifacts
        run: |
          find artifacts -type f -print
          ls -la artifacts/mod artifacts/plugin || true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          echo "-> cleaning stale release/tag 'latest'"
          gh release delete latest --repo "$REPO" --cleanup-tag --yes 2>/dev/null || echo "   (no stale release or tag)"
          sleep 2

          echo "-> creating release"
          gh release create latest \
            --repo "$REPO" \
            --title "HWIDAdmin build $GITHUB_RUN_NUMBER" \
            --notes "Auto-built from commit $GITHUB_SHA. Mod = Forge 1.20.1 client; plugin = Spigot/Paper 1.20.1." \
            artifacts/mod/*.jar artifacts/plugin/*.jar

          echo "-> done. Release assets:"
          gh api "repos/$REPO/releases/tags/latest" --jq '.assets[] | .name + " (" + (.size|tostring) + " bytes)  " + .browser_download_url' 2>/dev/null || true
